[package]
name = "eztopaz-core"
version = "0.1.0-preview08"
edition = "2021"
description = "ezTopaz pure logic: config, ffmpeg probe/args, audio mixer, frame pacer, supervisor"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# named pipe servers for the ffmpeg rawvideo/f32le inputs (design §4.1)
windows = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
] }

[features]
# platform capture backends (WGC/WASAPI/PipeWire/Portal) are wired in src-tauri;
# core stays pure so `cargo test` runs anywhere.
default = []
