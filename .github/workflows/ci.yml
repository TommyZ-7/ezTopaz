name: CI

on:
  push:
    branches: [main]
    tags: ['preview.*']
  pull_request:

jobs:
  linux:
    # 24.04: libspa 0.8 (pipewire-rs) needs newer SPA headers than 22.04 ships
    # (PipeWire 1.x has spa_video_info_raw.flags / u64 modifier). See requirements.md §283.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install system deps (Tauri + PipeWire)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libpipewire-0.3-dev pkg-config
      - name: Core tests
        run: cargo test -p eztopaz-core
      - name: Check capture-linux backend
        run: cargo check -p eztopaz --features capture-linux
      - name: Frontend
        run: pnpm i && pnpm build && pnpm test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Core tests
        run: cargo test -p eztopaz-core
      - name: Check capture-windows backend
        run: cargo check -p eztopaz --features capture-windows

  # Release bundles with the pinned FFmpeg bundled in (design §13.2, §4.4).
  # The BtbN build is GPL (libx264) — GPL notice must ship with artifacts (§11).
  # NOTE: Linux bundles deb only for now — AppImage's linuxdeploy fails with
  # "Failed to set rpath" when patchelf touches the bundled ffmpeg binary
  # (diagnosed 2026-09-02 with tauri build -v). Revisit with a linuxdeploy
  # wrapper (--exclude-files) or an upstream fix if AppImage is needed.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            features: capture-linux
            bundles: deb
          - os: windows-latest
            features: capture-windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # タグ push 時に GitHub Release を作成/更新するため
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install system deps (Tauri + PipeWire)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libpipewire-0.3-dev pkg-config
      - name: Download pinned FFmpeg (BtbN GPL build)
        shell: bash
        env:
          FFMPEG_TAG: autobuild-2026-09-02-13-13
          FFMPEG_DIR: ffmpeg-n8.1.2-50-g1a748fe2cd
        run: |
          mkdir -p src-tauri/resources/ffmpeg
          if [[ $RUNNER_OS == Linux ]]; then
            curl -sSL -o /tmp/ffmpeg.tar.xz \
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}/${FFMPEG_DIR}-linux64-gpl-8.1.tar.xz"
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp "/tmp/${FFMPEG_DIR}-linux64-gpl-8.1/bin/ffmpeg" src-tauri/resources/ffmpeg/
          else
            curl -sSL -o ffmpeg.zip \
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}/${FFMPEG_DIR}-win64-gpl-8.1.zip"
            # PowerShell cannot see Git-Bash's /tmp; use a workspace-relative path
            powershell -Command "Expand-Archive -Force ffmpeg.zip C:/tmp-ffmpeg"
            cp "/c/tmp-ffmpeg/${FFMPEG_DIR}-win64-gpl-8.1/bin/ffmpeg.exe" src-tauri/resources/ffmpeg/
          fi
      - name: Build bundles
        run: pnpm i && pnpm tauri build --features ${{ matrix.features }} --bundles ${{ matrix.bundles }}
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="MVP preview build. FFmpeg (BtbN GPL build) is bundled — the GPL notice must ship with the artifacts (design §11). Windows: NSIS installer. Linux: deb (AppImage is planned for a later release)."
          # matrix の2ジョブが同じ Release へ追記するため冪等に
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "ezTopaz $TAG" --notes "$NOTES"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            $(find target/release/bundle -type f \( -name '*.deb' -o -name '*.exe' \))
      - uses: actions/upload-artifact@v4
        with:
          name: eztopaz-${{ matrix.os }}
          # the cargo workspace target dir is at the repo root, not src-tauri/
          path: target/release/bundle/*
