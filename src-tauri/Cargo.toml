[package]
name = "eztopaz"
version = "0.1.0-preview05"
edition = "2021"
description = "Lightweight streamer for TopazChat"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
eztopaz-core = { path = "../eztopaz-core" }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
# capture-windows
windows = { version = "0.52", optional = true, features = [
  "implement",
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# capture-linux (requires system libpipewire at build time)
ashpd = { version = "0.7", optional = true, default-features = false, features = ["tokio"] }
pipewire = { version = "0.8", optional = true, features = ["v0_3_44"] }
libspa = { version = "0.8", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }

[features]
# Platform capture backends. Off by default so the core builds/tests anywhere.
# - capture-windows: WGC screen + WASAPI process-loopback audio (Win10 2004+)
# - capture-linux:   Portal (ashpd) + PipeWire screen/audio (needs libpipewire-dev)
default = []
capture-windows = ["dep:windows"]
capture-linux = ["dep:ashpd", "dep:pipewire", "dep:libspa", "dep:tokio"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
