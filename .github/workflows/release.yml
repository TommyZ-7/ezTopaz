name: Release

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'eztopaz-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/release.yml'
  # Release runs ONLY on explicit instruction (no tag auto-trigger).
  # Usage: gh workflow run Release --ref main -f tag=preview.04
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. preview.04). The tag must already exist.'
        required: true

# Manual dispatches for different tags must not cancel each other
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  # Release bundles with the pinned FFmpeg bundled in (design §13.2, §4.4).
  # The BtbN build is GPL (libx264) — GPL notice must ship with artifacts (§11).
  # NOTE: Linux bundles deb only for now — AppImage's linuxdeploy fails with
  # "Failed to set rpath" when patchelf touches the bundled ffmpeg binary
  # (diagnosed 2026-09-02 with tauri build -v). Revisit with a linuxdeploy
  # wrapper (--exclude-files) or an upstream fix if AppImage is needed.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            features: capture-linux
            bundles: deb
          - os: windows-latest
            features: capture-windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # 手動実行時に GitHub Release を作成/更新するため
    steps:
      - uses: actions/checkout@v4
      - name: Checkout release tag (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          [[ "${{ inputs.tag }}" == preview.* ]] || { echo "tag must match preview.*"; exit 1; }
          git fetch --tags --force
          git checkout "${{ inputs.tag }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install system deps (Tauri + PipeWire)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libpipewire-0.3-dev pkg-config
      - name: Download pinned FFmpeg (BtbN GPL build)
        shell: bash
        env:
          FFMPEG_TAG: autobuild-2026-09-02-13-13
          FFMPEG_DIR: ffmpeg-n8.1.2-50-g1a748fe2cd
        run: |
          mkdir -p src-tauri/resources/ffmpeg
          if [[ $RUNNER_OS == Linux ]]; then
            curl -sSL -o /tmp/ffmpeg.tar.xz \
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}/${FFMPEG_DIR}-linux64-gpl-8.1.tar.xz"
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp "/tmp/${FFMPEG_DIR}-linux64-gpl-8.1/bin/ffmpeg" src-tauri/resources/ffmpeg/
          else
            curl -sSL -o ffmpeg.zip \
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}/${FFMPEG_DIR}-win64-gpl-8.1.zip"
            # PowerShell cannot see Git-Bash's /tmp; use a workspace-relative path
            powershell -Command "Expand-Archive -Force ffmpeg.zip C:/tmp-ffmpeg"
            cp "/c/tmp-ffmpeg/${FFMPEG_DIR}-win64-gpl-8.1/bin/ffmpeg.exe" src-tauri/resources/ffmpeg/
          fi
          # GPL provenance: record the exact build inside the bundle (design §11)
          mkdir -p src-tauri/resources/licenses
          cat > src-tauri/resources/licenses/FFMPEG-BUILD.txt <<EOF
          Bundled FFmpeg build provenance (generated at bundle time)
          FFMPEG_TAG=${FFMPEG_TAG}
          FFMPEG_DIR=${FFMPEG_DIR}
          Linux: https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}/${FFMPEG_DIR}-linux64-gpl-8.1.tar.xz
          Windows: https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}/${FFMPEG_DIR}-win64-gpl-8.1.zip
          Build scripts and sources: https://github.com/BtbN/FFmpeg-Builds
          Upstream FFmpeg: https://github.com/FFmpeg/FFmpeg / https://ffmpeg.org/download.html
          License: GPL-2.0 (see GPL-2.0.txt in this directory)
          EOF
      - name: Build bundles
        run: pnpm i && pnpm tauri build --features ${{ matrix.features }} --bundles ${{ matrix.bundles }}
      - name: Publish release (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          NOTES="MVP preview build. FFmpeg (BtbN GPL build) is bundled — the GPL notice must ship with the artifacts (design §11). Windows: NSIS installer. Linux: deb (AppImage is planned for a later release)."
          # matrix の2ジョブが同じ Release へ追記するため冪等に
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "ezTopaz $TAG" --notes "$NOTES"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            $(find target/release/bundle -type f \( -name '*.deb' -o -name '*.exe' \))
      - uses: actions/upload-artifact@v4
        with:
          name: eztopaz-${{ matrix.os }}
          # the cargo workspace target dir is at the repo root, not src-tauri/
          path: target/release/bundle/*
